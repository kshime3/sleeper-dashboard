<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sleeper Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="img/icon.svg?v=20261104b">
  <link rel="apple-touch-icon" href="img/icon-180.png?v=20261104b">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#050f08">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261104b">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="brand"><span class="ball" aria-hidden="true">🏈</span><h1>FANTASY <span class="hq">HQ</span></h1></div>
      <button id="refresh" class="icon-btn" aria-label="Reload data" title="Reload data">⟳</button>
    </div>
    <!-- Jumbotron: the week and how you're doing across your leagues (tap = Game Day) -->
    <div id="jumbo" class="jumbo" role="button" aria-label="Open Game Day"></div>
    <select id="league-picker" aria-label="Choose a league"></select>
  </header>

  <main id="view" aria-live="polite">
    <p class="chalk-msg">🏈 Huddling up…<span class="sub">Loading your leagues</span></p>
  </main>

  <footer id="status" class="status"></footer>

  <!-- Player details panel (js/player.js + renderPlayerSheet in js/ui.js) -->
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-label="Player details">
    <div class="sheet-bg" data-sheet-close></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="team" class="active"><span>🏈</span>My Team</button>
    <button data-tab="gameday"><span>📺</span>Game Day</button>
    <button data-tab="waivers"><span>📈</span>Waivers</button>
    <button data-tab="trade"><span>🔁</span>Trade</button>
    <button data-tab="standings"><span>🏆</span>Standings</button>
  </nav>

  <script src="js/config.js?v=20261104b"></script>
  <script src="js/sleeper.js?v=20261104b"></script>
  <script src="js/espn.js?v=20261104b"></script>
  <script src="js/stats.js?v=20261104b"></script>
  <script src="js/games.js?v=20261104b"></script>
  <script src="js/myteam.js?v=20261104b"></script>
  <script src="js/waivers.js?v=20261104b"></script>
  <script src="js/trade.js?v=20261104b"></script>
  <script src="js/standings.js?v=20261104b"></script>
  <script src="js/history.js?v=20261104b"></script>
  <script src="js/gameday.js?v=20261104b"></script>
  <script src="js/player.js?v=20261104b"></script>
  <script src="js/ui.js?v=20261104b"></script>
  <script src="js/main.js?v=20261104b"></script>
</body>
</html>
