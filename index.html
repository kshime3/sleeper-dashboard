<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sleeper Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="img/icon.svg?v=20261102o">
  <link rel="apple-touch-icon" href="img/icon-180.png?v=20261102o">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#101722">
  <link rel="stylesheet" href="css/style.css?v=20261102o">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Sleeper Dashboard</h1>
      <button id="refresh" class="icon-btn" aria-label="Reload data" title="Reload data">⟳</button>
    </div>
    <select id="league-picker" aria-label="Choose a league"></select>
  </header>

  <main id="view" aria-live="polite">
    <p class="muted center">Loading your leagues…</p>
  </main>

  <footer id="status" class="status"></footer>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="team" class="active"><span>🏈</span>My Team</button>
    <button data-tab="gameday"><span>📺</span>Game Day</button>
    <button data-tab="waivers"><span>📈</span>Waivers</button>
    <button data-tab="trade"><span>🔁</span>Trade</button>
    <button data-tab="standings"><span>🏆</span>Standings</button>
  </nav>

  <script src="js/config.js?v=20261102o"></script>
  <script src="js/sleeper.js?v=20261102o"></script>
  <script src="js/stats.js?v=20261102o"></script>
  <script src="js/games.js?v=20261102o"></script>
  <script src="js/myteam.js?v=20261102o"></script>
  <script src="js/waivers.js?v=20261102o"></script>
  <script src="js/trade.js?v=20261102o"></script>
  <script src="js/standings.js?v=20261102o"></script>
  <script src="js/gameday.js?v=20261102o"></script>
  <script src="js/ui.js?v=20261102o"></script>
  <script src="js/main.js?v=20261102o"></script>
</body>
</html>
